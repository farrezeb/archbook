########################################################################
# HYPRLAND - MACBOOK A1278
# hyprland.conf — formato clássico, estável
########################################################################

# ── Variáveis de Ambiente ──────────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland
env = GTK_THEME,Adwaita:dark
env = QT_STYLE_OVERRIDE,adwaita-dark
env = GTK_FONT_NAME,SF Pro Text 10

# ── Cores do Pywal ────────────────────────────────────────────────────
source = ~/.cache/wal/colors-hyprland.conf

# ── Variáveis de Programas ────────────────────────────────────────────
$mod         = SUPER
$terminal    = foot
$menu        = fuzzel
$fileManager = foot lf
$browser     = qutebrowser

# ── Monitor ───────────────────────────────────────────────────────────
monitor = LVDS-1,preferred,0x0,1

# ── Render ────────────────────────────────────────────────────────────
render {
    direct_scanout = false
}

# ── Misc ──────────────────────────────────────────────────────────────
misc {
    vrr                     = 0
    disable_hyprland_logo   = true
    force_default_wallpaper = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms  = true
    enable_swallow          = true
    swallow_regex           = ^(foot)$
}

# ── Input (Trackpad MacBook) ──────────────────────────────────────────
input {
    kb_layout  = ch
    kb_variant = fr_mac
    kb_model   = apple_laptop

    touchpad {
        natural_scroll       = true
        tap-to-click         = true
        clickfinger_behavior = true
        scroll_factor        = 0.5
        drag_lock            = true
    }
}


# ── Aparência e Layout ────────────────────────────────────────────────
general {
    gaps_in             = 4
    gaps_out            = 5
    border_size         = 2
    col.active_border   = $color1 $color4 45deg
    col.inactive_border = 0xff444444
    layout              = master
}

decoration {
    rounding           = 8
    active_opacity     = 1.0
    inactive_opacity   = 0.75
    fullscreen_opacity = 1.0
    dim_inactive       = true
    dim_strength       = 0.12
    dim_special        = 0.25

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

# ── Animações (leves para Intel HD 3000) ─────────────────────────────
animations {
    enabled = true

    bezier = instant, 0.0, 0.0, 1.0, 1.0
    bezier = smooth,  0.25, 0.1, 0.25, 1.0

    animation = windows,    1, 4, smooth
    animation = windowsOut, 1, 3, smooth, popin 95%
    animation = border,     1, 5, instant
    animation = fade,       1, 4, smooth
    animation = workspaces, 1, 4, smooth, slide
}

# ── Layouts ───────────────────────────────────────────────────────────

master {
    new_on_top  = true
    mfact       = 0.6
    new_status  = master
    orientation = left
}

# ── Plugins ───────────────────────────────────────────────────────────
plugin {
    hyprfocus {
        enabled                 = true
        animate_floating        = true
        animate_workspacechange = true
        focus_animation         = shrink
        bezier                  = realsmooth, 0.28, 0.29, 0.69, 1.08
    }
}

# ── Regras de Janela ──────────────────────────────────────────────────
windowrule = match:class ^(Share|localsend)$, float on, center on
windowrule = match:class ^(foot)$,        opacity 0.9 override 0.9 override
windowrule = match:class ^(qutebrowser)$, opacity 0.85 override 0.85 override
windowrule = match:class ^(dunst)$,       opacity 0.95 override 0.95 override

# MacBook update floating terminal
windowrule = match:class ^(floating-terminal)$, float on
windowrule = match:class ^(floating-terminal)$, size 850 550
windowrule = match:class ^(floating-terminal)$, center on

# ── Inicialização ─────────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = awww-daemon
exec-once = waybar > /dev/null 2>&1
exec-once = dunst
exec-once = cat ~/.cache/wal/sequences
exec-once = hyprpm reload -n
exec-once = ~/.local/bin/power-monitor.sh > /dev/null 2>&1

# ── Atalhos — Básicos ─────────────────────────────────────────────────
bind = $mod, RETURN,      exec, $terminal
bind = $mod, D,           exec, $menu
bind = $mod, E,           exec, $fileManager
bind = $mod, Q,           killactive

# Monitor de sistema (F4 MacBook)
bind = , XF86LaunchB, exec, [float;center;size 900 600] $terminal -e btop

# Menu de saída
bind = $mod SHIFT, M, exec, echo -e "Sair\nReiniciar\nDesligar" | fuzzel -d -p "Escolha: " | xargs -I{} bash -c "case {} in 'Sair') hyprctl dispatch exit ;; 'Reiniciar') reboot ;; 'Desligar') poweroff ;; esac"

# ── Capturas de Tela ──────────────────────────────────────────────────
bind = CTRL SHIFT, 3, exec, grim -l 0 ~/media/Capturas\ de\ tela/$(date +'%Y%m%d_%H%M%S').png && notify-send "      Screenshot" "Tela cheia"
bind = CTRL SHIFT, 4, exec, grim -l 0 -g "$(slurp)" ~/media/Capturas\ de\ tela/$(date +'%Y%m%d_%H%M%S').png && notify-send "      Screenshot" "Área salva"

# ── Workspaces — Navegação e Mover Janelas ────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Navegação relativa
bind = $mod, left,  workspace, e-1
bind = $mod, right, workspace, e+1
bind = $mod, TAB,         cyclenext, prev
bind = $mod SHIFT, TAB,   cyclenext

# ── Foco e Movimentação de Janelas ────────────────────────────────────
bind = $mod, J, layoutmsg, cyclenext
bind = $mod, K, layoutmsg, cycleprev
bind = $mod, SPACE, layoutmsg, swapwithmaster

bind = $mod SHIFT, left,  swapwindow, l
bind = $mod SHIFT, right, swapwindow, r
bind = $mod SHIFT, up,    movefocus,  u
bind = $mod SHIFT, down,  movefocus,  d

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d


# ── Controle de Janelas ───────────────────────────────────────────────
bind  = $mod SHIFT, T, togglefloating
bind  = $mod SHIFT, F, fullscreen, 0
bind  = $mod ALT,   F, fullscreen, 1
bind  = $mod,       F, layoutmsg, mfact 0.5
binde = $mod,       L, layoutmsg, mfact +0.05
binde = $mod,       H, layoutmsg, mfact -0.05

# Float + center
bind = $mod SHIFT, C, togglefloating
bind = $mod SHIFT, C, centerwindow

# Float + resize 50%×43% + center (modo mini)
bind = $mod, N, togglefloating
bind = $mod, N, resizeactive, exact 60% 50%
bind = $mod, N, centerwindow

# ── Scratchpad ────────────────────────────────────────────────────────
bind = $mod,       S, togglespecialworkspace, scratchpad
bind = $mod ALT,   S, movetoworkspacesilent,  special:scratchpad

# ── Grupos de Janelas ─────────────────────────────────────────────────
bind = $mod,     G,   togglegroup
bind = $mod ALT, G,   moveoutofgroup

# ── Modo de Redimensionamento (Submap) ───────────────────────────────
bind = $mod, R, submap, resize

submap = resize
binde = , right, resizeactive,  20 0
binde = , left,  resizeactive, -20 0
binde = , up,    resizeactive,  0 -20
binde = , down,  resizeactive,  0  20
bind  = , escape, submap, reset
bind  = , RETURN, submap, reset
submap = reset

# ── Mouse ─────────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Teclas de Hardware MacBook ────────────────────────────────────────
# Brilho da tela
binde = , XF86MonBrightnessUp,   exec, brightnessctl set 10%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Brilho do teclado
binde = , XF86KbdBrightnessUp,   exec, brightnessctl -d '*kbd_backlight' set 10%+
binde = , XF86KbdBrightnessDown, exec, brightnessctl -d '*kbd_backlight' set 10%-

# Volume
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Mídia
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Bloqueio e Wallpaper
bind = $mod SHIFT, L, exec, /usr/local/bin/lockscreen
bind = $mod SHIFT, W, exec, ~/.local/bin/random_wall.sh

# Hyprpicker
bind = $mod, P, exec, hyprpicker -a

# ── Bluetooth ─────────────────────────────────────────────────────────
bind = $mod,       B, exec, sudo systemctl start bluetooth && hyprctl dispatch exec '[float;center;size 800 500]' blueman-manager
bind = $mod SHIFT, B, exec, sudo systemctl stop bluetooth
